<title>served through dead-drop</title>
<h1>This page came from peer-a.</h1>
<p>
  It was never served over the network. peer-a wrote it as encrypted objects into whatever sits in
  the middle -- a folder, a git repository, a GitHub repository -- peer-b read them back, and your
  browser is talking to a local port on peer-b.
</p>
