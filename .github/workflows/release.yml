name: Release

# Publishing happens when a GitHub release is published, not when a tag is
# pushed. A tag is then a cheap, reversible marker: cut as many as are useful,
# push them, and publish only the ones that earn it. Triggering on the tag made
# the two the same act, so there was no way to hold a candidate anywhere except
# on the machine that tagged it.
#
# `workflow_dispatch` covers the case where a release exists but its run failed,
# which is otherwise awkward to retry.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish from
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # A release event checks out the tag it was created from; a manual run has
      # to be told which tag, or it would publish whatever main happens to hold.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run build && npm test
      # transport-sdk first: dead-drop depends on it, and a package cannot
      # publish before the packages it depends on exist at the published version.
      #
      # The two packages version independently, so a release usually moves only
      # one of them. Skip whichever is already on the registry: npm rejects a
      # republish of an existing version, and under `set -e` that would abort
      # the job before the package that actually changed gets published.
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in packages/transport-sdk packages/dead-drop; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            echo "publishing $name@$version"
            npm publish --workspace "$pkg" --access public --provenance
          done
