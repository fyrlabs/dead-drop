name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run build && npm test
      # transport-sdk first: dead-drop depends on it, and a package cannot
      # publish before the packages it depends on exist at the published version.
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in packages/transport-sdk packages/dead-drop; do
            npm publish --workspace "$pkg" --access public --provenance
          done
